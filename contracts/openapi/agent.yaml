openapi: 3.1.0
info:
  title: Alfa Hack Agent API
  version: 0.1.0
  description: Stateless Python agent. Receives company context and evidence, streams progress and a structured insight.
servers:
  - url: http://agent:8090
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                required: [status, mode]
                properties:
                  status:
                    type: string
                    const: ok
                  mode:
                    type: string
                    enum: [stub, live]
  /v1/analyses:
    post:
      operationId: createAnalysis
      description: Streams step events followed by one result or error event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
      responses:
        "200":
          description: SSE stream with step, result and error events
          content:
            text/event-stream:
              schema:
                type: string
        "422":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    AnalysisRequest:
      type: object
      required: [request_id, company, event]
      properties:
        request_id:
          type: string
        company:
          $ref: "#/components/schemas/CompanyContext"
        event:
          $ref: "#/components/schemas/EventContext"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        locale:
          type: string
          default: ru
        mode:
          type: string
          enum: [live, demo]
          default: live
    CompanyContext:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        inn:
          type: string
        industry:
          type: string
        region:
          type: string
        description:
          type: string
    EventContext:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        published_at:
          type: string
          format: date-time
    Evidence:
      type: object
      required: [source_id, title, url]
      properties:
        source_id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        snippet:
          type: string
        published_at:
          type: string
          format: date-time
    Source:
      type: object
      required: [source_id, title, url]
      properties:
        source_id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
    Insight:
      type: object
      required:
        - summary
        - why_it_matters
        - risks
        - opportunities
        - bank_position
        - ai_conclusion
        - sources
        - actions
        - confidence
      properties:
        summary:
          type: string
        why_it_matters:
          type: string
        risks:
          type: array
          items:
            type: string
        opportunities:
          type: array
          items:
            type: string
        bank_position:
          type: string
        ai_conclusion:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        actions:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        meta:
          type: object
          additionalProperties: true
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
