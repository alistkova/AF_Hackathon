openapi: 3.1.0
info:
  title: Alfa Hack Public API
  version: 0.1.0
  description: Public gateway API consumed by the web client.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: Gateway is ready
  /api/v1/companies:
    get:
      operationId: listCompanies
      description: Companies the current user may read. Admins see every company.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Company list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /api/v1/companies/{companyId}:
    get:
      operationId: getCompany
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PathCompanyId"
      responses:
        "200":
          description: Company profile with people and relations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Company not found or not accessible to the user
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /api/v1/companies/{companyId}/people:
    get:
      operationId: listCompanyPeople
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PathCompanyId"
      responses:
        "200":
          description: Company people list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyPerson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Company not found or not accessible to the user
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /api/v1/companies/{companyId}/relations:
    get:
      operationId: listCompanyRelations
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PathCompanyId"
      responses:
        "200":
          description: Company relations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyRelation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Company not found or not accessible to the user
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /api/v1/news:
    get:
      operationId: listNews
      description: Documents and news. Filters combine with AND; `X-Total-Count` carries the total.
      parameters:
        - name: kind
          in: query
          schema:
            type: string
        - name: sector
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Documents
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
  /api/v1/news/{newsId}:
    get:
      operationId: getNews
      parameters:
        - name: newsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
        "404":
          description: Document not found
  /api/v1/search:
    get:
      operationId: searchDocuments
      description: Ranked full-text search across news and PDF documents.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: kind
          in: query
          schema:
            type: string
        - name: sector
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Ranked matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Missing query
  /api/v1/feed:
    get:
      operationId: getFeed
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Ranked feed
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeedItem"
  /api/v1/insights/jobs:
    post:
      operationId: createInsightJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInsightJob"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightJob"
  /api/v1/insights/jobs/{jobId}:
    get:
      operationId: getInsightJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightJob"
        "404":
          description: Job not found
  /api/v1/insights/jobs/{jobId}/events:
    get:
      operationId: streamInsightJob
      description: SSE stream. Supports Last-Event-ID for resume.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: SSE stream of status, step, result and error events
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Job not found
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: alfa_session
  responses:
    Unauthorized:
      description: Session is missing or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdentityUnavailable:
      description: Identity service is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    CompanyId:
      name: company_id
      in: query
      required: true
      schema:
        type: string
    PathCompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Company:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        inn:
          type: string
        industry:
          type: string
        region:
          type: string
        description:
          type: string
        group_id:
          type: string
        okved_code:
          type: string
        okved_name:
          type: string
        client_type:
          type: string
        revenue:
          type: string
        city:
          type: string
        products:
          type: object
          additionalProperties:
            type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
    Person:
      type: object
      required: [id, full_name, role, created_at]
      properties:
        id:
          type: string
        full_name:
          type: string
        role:
          type: string
        city:
          type: string
        region:
          type: string
        created_at:
          type: string
          format: date-time
    CompanyPerson:
      type: object
      required: [person, relation]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        relation:
          type: string
    CompanyRelation:
      type: object
      required: [company_id, company_name, type, types, relation]
      properties:
        company_id:
          type: string
        company_name:
          type: string
        type:
          type: string
          enum: [group, shared_person, counterparty]
        types:
          type: array
          items:
            type: string
            enum: [group, shared_person, counterparty]
        relation:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        amount:
          type: number
        count:
          type: integer
          format: int64
        shared_people:
          type: integer
          format: int64
    CompanyDetails:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          required: [people, relations]
          properties:
            people:
              type: array
              items:
                $ref: "#/components/schemas/CompanyPerson"
            relations:
              type: array
              items:
                $ref: "#/components/schemas/CompanyRelation"
    EventContext:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
    CreateInsightJob:
      type: object
      required: [company_id, event]
      properties:
        company_id:
          type: string
        event:
          $ref: "#/components/schemas/EventContext"
    InsightJob:
      type: object
      required: [job_id, status, events_url]
      properties:
        job_id:
          type: string
        company_id:
          type: string
        status:
          type: string
          enum: [queued, running, done, failed]
        events_url:
          type: string
        insight:
          $ref: "#/components/schemas/Insight"
        error:
          type: string
    FeedItem:
      type: object
      required: [event_id, company_id, title, summary, published_at]
      properties:
        event_id:
          type: string
        company_id:
          type: string
        title:
          type: string
        summary:
          type: string
        published_at:
          type: string
          format: date-time
    Source:
      type: object
      required: [source_id, title, url]
      properties:
        source_id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
    Insight:
      type: object
      required:
        - summary
        - why_it_matters
        - risks
        - opportunities
        - bank_position
        - ai_conclusion
        - sources
        - actions
        - confidence
      properties:
        summary:
          type: string
        why_it_matters:
          type: string
        risks:
          type: array
          items:
            type: string
        opportunities:
          type: array
          items:
            type: string
        bank_position:
          type: string
        ai_conclusion:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        actions:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
    NewsItem:
      type: object
      required: [document_id, news_id, title, published_at, source_name, source_url, tags, target_sectors]
      properties:
        document_id:
          type: string
        news_id:
          type: string
        title:
          type: string
        published_at:
          type: string
          format: date-time
        source_name:
          type: string
        source_url:
          type: string
        full_text:
          type: string
        tags:
          type: array
          items:
            type: string
        target_sectors:
          type: array
          items:
            type: string
    SearchHit:
      allOf:
        - $ref: "#/components/schemas/NewsItem"
        - type: object
          required: [rank]
          properties:
            rank:
              type: number
    SearchResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        total:
          type: integer
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
