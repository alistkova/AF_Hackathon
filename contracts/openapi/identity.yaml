openapi: 3.1.0
info:
  title: Identity Service API
  version: 0.1.0
  description: Users, sessions and company access for the Alfa Hack news analytics prototype.
servers:
  - url: http://identity:8086
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: identity
  /api/v1/auth/register:
    post:
      operationId: registerUser
      description: |
        Creates a user when `IDENTITY_REGISTRATION_ENABLED` is true. The first registered user
        becomes an admin, every later user is an analyst.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Email or password does not meet the requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Registration is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/login:
    post:
      operationId: loginUser
      description: Verifies the credentials, opens a session and sets the session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Session opened
          headers:
            Set-Cookie:
              description: HttpOnly session cookie named by `SESSION_COOKIE_NAME`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts; retry after the `Retry-After` header
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      description: |
        Revokes the current session when a valid token is supplied and always clears the
        session cookie. Idempotent and safe to call without a session.
      responses:
        "204":
          description: Session revoked
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me:
    get:
      operationId: currentUser
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateCurrentUser
      description: |
        Updates the email and/or the primary company of the current user. At least one field
        must be present. An empty `primary_company_id` clears the selection.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Malformed request, invalid email or invalid company id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/password:
    post:
      operationId: changePassword
      description: |
        Changes the password after verifying the current one. Every other session of the user
        is revoked; the session used for the request stays valid.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed
        "400":
          description: Wrong current password or new password does not meet the requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many wrong current-password attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/companies:
    get:
      operationId: listAccessibleCompanies
      description: |
        Company ids the current user belongs to. Used by the gateway for access checks;
        roles are available from `/api/v1/me/memberships`.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Accessible company identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/memberships:
    get:
      operationId: listMemberships
      description: Companies the current user belongs to, with the membership role.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/companies/{companyId}/members:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      operationId: listCompanyMembers
      description: Company roster. Available to members of the company and system admins.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Company members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Company not found or the user is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: addCompanyMember
      description: |
        Adds an existing user to the company as a member. The requester must be an owner of
        the company or a system admin. Adding an existing member is idempotent.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMember"
      responses:
        "200":
          description: Member added or already present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Malformed request or invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The requester is not an owner of the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Company or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/companies/{companyId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateCompanyMemberRole
      description: |
        Changes the membership role. The requester must be an owner of the company or a
        system admin. The last owner cannot be demoted.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleUpdate"
      responses:
        "204":
          description: Role updated
        "400":
          description: Malformed request or invalid role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The requester is not an owner of the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Company or member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The member is the last owner of the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeCompanyMember
      description: |
        Removes a member. The requester must be an owner of the company or a system admin.
        The last owner cannot be removed. If the removed member had this company as the
        primary company, that selection is cleared.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Member removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The requester is not an owner of the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Company or member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The member is the last owner of the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/internal/memberships:
    post:
      operationId: createMembership
      description: |
        Internal service endpoint used by the gateway after company creation. It records the
        creator as the company owner. It is not routed through the public gateway and
        requires the `IDENTITY_INTERNAL_TOKEN` shared secret.
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipInput"
      responses:
        "204":
          description: Membership stored
        "400":
          description: Malformed request or invalid role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Missing or invalid internal token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/access/grant:
    post:
      operationId: grantCompanyAccess
      description: |
        Grants a user access to a company. Admin only. The optional role defaults to
        `member`; the first owner of a company must be set with `role: owner`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessGrant"
      responses:
        "204":
          description: Access granted
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current user is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The change would demote the last owner of the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/access/revoke:
    post:
      operationId: revokeCompanyAccess
      description: |
        Revokes a user's access to a company. Admin only. The last owner of a company
        cannot be revoked.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessGrant"
      responses:
        "204":
          description: Access revoked
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current user is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The membership is the last owner of the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: alfa_session
  responses:
    Unauthorized:
      description: Session is missing or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Identity service is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
    User:
      type: object
      required: [id, email, role, primary_company_id]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, analyst]
        primary_company_id:
          type: string
          description: Company the user identifies with; empty when not chosen.
    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        primary_company_id:
          type: string
          maxLength: 128
          description: Empty string clears the selection; otherwise the user must be a member.
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 72
    Membership:
      type: object
      required: [company_id, role]
      properties:
        company_id:
          type: string
        role:
          type: string
          enum: [owner, member]
    MembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    Member:
      type: object
      required: [user_id, email, role]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, member]
    MemberRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, member]
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    AddMember:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    MembershipInput:
      type: object
      required: [user_id, company_id]
      properties:
        user_id:
          type: string
          minLength: 1
        company_id:
          type: string
          minLength: 1
        role:
          type: string
          enum: [owner, member]
          default: member
    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    AccessGrant:
      type: object
      required: [user_id, company_id]
      properties:
        user_id:
          type: string
          minLength: 1
        company_id:
          type: string
          minLength: 1
        role:
          type: string
          enum: [owner, member]
          default: member
    CompanyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
