[project]
name = "alfa-hack-agent"
version = "0.1.0"
description = "Stateless news impact analysis agent with RAG"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sse-starlette>=2.2,<3",
  "httpx>=0.28,<1",
  # RAG dependencies
  "langchain>=0.2.0",
  "langchain-community>=0.2.0",
  "langchain-postgres>=0.0.19",
  "psycopg[binary]>=3.1.0",
  "pdfplumber>=0.11.0",
  "pymupdf>=1.23.0",
  "requests>=2.31.0",
  "watchdog>=3.0.0",
  "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
hf = [
  "langchain-huggingface>=0.1.0",
  "sentence-transformers>=3.0.0",
  "langchain-postgres>=0.0.19",
  "psycopg[binary]>=3.1.0",
]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["app/contracts/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
