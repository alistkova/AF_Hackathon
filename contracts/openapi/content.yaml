openapi: 3.1.0
info:
  title: Content Service API
  version: 0.2.0
servers:
  - url: http://content:8082
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: Ready
  /api/v1/news:
    get:
      operationId: listNews
      description: |
        Returns documents in the format expected by the AI team. Filters combine with AND.
        Pagination uses `limit` and `offset`; the total number of matches is returned in
        the `X-Total-Count` response header.
      parameters:
        - $ref: "#/components/parameters/Kind"
        - $ref: "#/components/parameters/Sector"
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: News items
          headers:
            X-Total-Count:
              description: Total number of documents matching the filters.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Content service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/news/{newsId}:
    get:
      operationId: getNews
      description: Returns one document by its `news_id` or `document_id`.
      parameters:
        - name: newsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Content service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/search:
    get:
      operationId: searchDocuments
      description: |
        Full-text search over titles and bodies with the PostgreSQL `russian`
        configuration. Results are ranked with `ts_rank_cd`; filters combine with AND.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/Kind"
        - $ref: "#/components/parameters/Sector"
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Ranked matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Missing or invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Content service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/documents:
    post:
      operationId: ingestDocuments
      description: |
        Ingests documents. Duplicates are detected by the canonical source URL and by a
        content hash over the normalised title and body, so the same material republished
        under another id does not create a second row. Idempotent per document id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "200":
          description: Per-document ingest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Content service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/documents/pdf:
    post:
      operationId: uploadPdf
      description: |
        Stores the raw PDF, extracts its text layer with `pdftotext` and ingests it as a
        `pdf` document. The document id is derived from the file digest, so re-uploading
        the same file updates the existing document.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                source_name:
                  type: string
                source_url:
                  type: string
                published_at:
                  type: string
                  format: date
                tags:
                  type: string
                  description: Comma-separated list.
                sectors:
                  type: string
                  description: Comma-separated list.
      responses:
        "200":
          description: Document stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Missing file or invalid encoding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File is larger than 25 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: File is not a PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Text extraction is unavailable or produced no text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Content service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/documents/{documentId}/chunks:
    get:
      operationId: listDocumentChunks
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chunks ordered by ordinal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentChunksResponse"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Content service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/rag/chunks:
    post:
      operationId: upsertRagChunks
      description: Upserts embedded chunks. Chunks are keyed by source, page and chunk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagUpsertRequest"
      responses:
        "200":
          description: Chunks stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagUpsertResponse"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteRagChunks
      description: Removes every stored chunk.
      responses:
        "200":
          description: Chunks removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagDeleteResponse"
        "500":
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/rag/chunks/search:
    post:
      operationId: searchRagChunks
      description: Returns the closest chunks by cosine distance with metadata filters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagSearchRequest"
      responses:
        "200":
          description: Matching chunks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagChunksResponse"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/rag/chunks/list:
    post:
      operationId: listRagChunks
      description: Lists chunks by metadata, newest published first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagListRequest"
      responses:
        "200":
          description: Matching chunks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagChunksResponse"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/rag/chunks/count:
    get:
      operationId: countRagChunks
      responses:
        "200":
          description: Number of stored chunks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagCountResponse"
        "500":
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    Kind:
      name: kind
      in: query
      description: Document kind, for example `news` or `pdf`.
      schema:
        type: string
    Sector:
      name: sector
      in: query
      description: Matches `target_sectors` exactly.
      schema:
        type: string
    Tag:
      name: tag
      in: query
      description: Matches `tags` exactly.
      schema:
        type: string
    Source:
      name: source
      in: query
      description: Matches `source_name` exactly.
      schema:
        type: string
    From:
      name: from
      in: query
      description: Lower bound for the publication time (`2006-01-02` or RFC3339).
      schema:
        type: string
    To:
      name: to
      in: query
      description: Upper bound for the publication time (`2006-01-02` or RFC3339).
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size, 1..200. Defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
  schemas:
    NewsItem:
      type: object
      required:
        - document_id
        - news_id
        - title
        - published_at
        - source_name
        - source_url
        - full_text
        - tags
        - target_sectors
      properties:
        document_id:
          type: string
        news_id:
          type: string
        title:
          type: string
        published_at:
          type: string
          format: date-time
        source_name:
          type: string
        source_url:
          type: string
        full_text:
          type: string
        tags:
          type: array
          items:
            type: string
        target_sectors:
          type: array
          items:
            type: string
    SearchHit:
      allOf:
        - $ref: "#/components/schemas/NewsItem"
        - type: object
          required: [rank]
          properties:
            rank:
              type: number
              description: PostgreSQL `ts_rank_cd` score.
    SearchResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        total:
          type: integer
    DocumentChunk:
      type: object
      required: [ordinal, content]
      properties:
        ordinal:
          type: integer
        content:
          type: string
    DocumentChunksResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentChunk"
    IngestItem:
      type: object
      required: [title, full_text]
      properties:
        document_id:
          type: string
        news_id:
          type: string
        kind:
          type: string
          default: news
        title:
          type: string
        published_at:
          type: string
          format: date-time
        source_name:
          type: string
        source_url:
          type: string
        full_text:
          type: string
        tags:
          type: array
          items:
            type: string
        target_sectors:
          type: array
          items:
            type: string
    IngestRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/IngestItem"
    IngestResult:
      type: object
      required: [status, document_id, news_id, chunks]
      properties:
        status:
          type: string
          enum: [created, updated, duplicate]
        document_id:
          type: string
        news_id:
          type: string
        chunks:
          type: integer
    IngestResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IngestResult"
    RagChunk:
      type: object
      required: [content, source, page, chunk, company_id, sector]
      properties:
        content:
          type: string
        source:
          type: string
        page:
          type: integer
        chunk:
          type: integer
        company_id:
          type: string
        sector:
          type: string
        published_at:
          type: string
          format: date
        distance:
          type: number
    RagChunkUpsert:
      type: object
      required: [content, source, page, chunk, company_id, sector, embedding]
      properties:
        content:
          type: string
        source:
          type: string
        page:
          type: integer
        chunk:
          type: integer
        company_id:
          type: string
        sector:
          type: string
        published_at:
          type: string
          format: date
        embedding:
          type: array
          minItems: 384
          maxItems: 384
          items:
            type: number
    RagUpsertRequest:
      type: object
      required: [chunks]
      properties:
        chunks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RagChunkUpsert"
    RagUpsertResponse:
      type: object
      required: [upserted]
      properties:
        upserted:
          type: integer
    RagSearchRequest:
      type: object
      required: [embedding]
      properties:
        embedding:
          type: array
          minItems: 384
          maxItems: 384
          items:
            type: number
        top_k:
          type: integer
          default: 10
          minimum: 1
          maximum: 200
        max_distance:
          type: number
          minimum: 0
        company_id:
          type: string
        sector:
          type: string
        published_after:
          type: string
          format: date
        published_before:
          type: string
          format: date
    RagListRequest:
      type: object
      properties:
        top_k:
          type: integer
          default: 100
          minimum: 1
          maximum: 200
        company_id:
          type: string
        sector:
          type: string
        published_after:
          type: string
          format: date
        published_before:
          type: string
          format: date
    RagChunksResponse:
      type: object
      required: [chunks]
      properties:
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/RagChunk"
    RagCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
    RagDeleteResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
