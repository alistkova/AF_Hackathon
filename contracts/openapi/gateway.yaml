openapi: 3.1.0
info:
  title: Alfa Hack Public API
  version: 0.1.0
  description: Public gateway API consumed by the web client.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: Gateway is ready
  /api/v1/companies:
    get:
      operationId: listCompanies
      description: Companies the current user belongs to. Every role, including admin, is limited to memberships.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Company list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
    post:
      operationId: createCompany
      description: |
        Creates a company and makes the current user its owner. The gateway calls the company
        service and then records the membership in identity; if the second step fails the
        company is deleted.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreate"
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: Invalid company data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Company or identity service failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/companies/{companyId}:
    get:
      operationId: getCompany
      description: |
        Company profile. Members see the companies they belong to; system admins may read any
        company by id so they can manage it, but the company list stays membership-filtered.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PathCompanyId"
      responses:
        "200":
          description: Company profile with people and relations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Company not found or not accessible to the user
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
    put:
      operationId: updateCompany
      description: |
        Updates the editable company fields. Only the company owner or a system admin may
        edit a company; members receive `403`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PathCompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: Invalid company data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The current user is not an owner of the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /api/v1/companies/{companyId}/people:
    get:
      operationId: listCompanyPeople
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PathCompanyId"
      responses:
        "200":
          description: Company people list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyPerson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Company not found or not accessible to the user
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /api/v1/companies/{companyId}/relations:
    get:
      operationId: listCompanyRelations
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PathCompanyId"
      responses:
        "200":
          description: Company relations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyRelation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Company not found or not accessible to the user
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /api/v1/companies/{companyId}/members:
    parameters:
      - $ref: "#/components/parameters/PathCompanyId"
    get:
      operationId: listCompanyMembers
      description: Company roster. Available to members of the company and system admins.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Company members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Company not found or not accessible to the user
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
    post:
      operationId: addCompanyMember
      description: Adds an existing user to the company. Owner or system admin only.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMember"
      responses:
        "200":
          description: Member added or already present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Malformed request or invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The requester is not an owner of the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Company or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /api/v1/companies/{companyId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/PathCompanyId"
      - $ref: "#/components/parameters/PathUserId"
    patch:
      operationId: updateCompanyMemberRole
      description: Changes a member role. Owner or system admin only; the last owner cannot be demoted.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleUpdate"
      responses:
        "204":
          description: Role updated
        "400":
          description: Malformed request or invalid role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The requester is not an owner of the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Company or member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The member is the last owner of the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
    delete:
      operationId: removeCompanyMember
      description: Removes a member. Owner or system admin only; the last owner cannot be removed.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Member removed
        "403":
          description: The requester is not an owner of the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Company or member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The member is the last owner of the company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /api/v1/news:
    get:
      operationId: listNews
      description: Documents and news. Filters combine with AND; `X-Total-Count` carries the total.
      parameters:
        - name: kind
          in: query
          schema:
            type: string
        - name: sector
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Documents
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
  /api/v1/news/{newsId}:
    get:
      operationId: getNews
      parameters:
        - name: newsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
        "404":
          description: Document not found
  /api/v1/search:
    get:
      operationId: searchDocuments
      description: Ranked full-text search across news and PDF documents.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: kind
          in: query
          schema:
            type: string
        - name: sector
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Ranked matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Missing query
  /api/v1/documents:
    post:
      operationId: ingestDocuments
      description: Admin only. Normalises, deduplicates and chunks documents through the content service.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/IngestItem"
      responses:
        "200":
          description: Per-document ingest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: Invalid payload
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current user is not an admin
        "500":
          description: Content service is unavailable
  /api/v1/documents/pdf:
    post:
      operationId: uploadPdf
      description: Admin only. Stores a PDF and ingests its extracted text.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                source_name:
                  type: string
                source_url:
                  type: string
                published_at:
                  type: string
                tags:
                  type: string
                sectors:
                  type: string
      responses:
        "200":
          description: Document stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Invalid file or fields
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current user is not an admin
        "413":
          description: File is larger than 25 MB
        "415":
          description: File is not a PDF
        "422":
          description: Text extraction is unavailable or empty
        "500":
          description: Content service is unavailable
  /api/v1/documents/{documentId}/chunks:
    get:
      operationId: listDocumentChunks
      description: Admin only. Chunks of one document.
      security:
        - sessionCookie: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document chunks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentChunksResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current user is not an admin
        "404":
          description: Document not found
        "500":
          description: Content service is unavailable
  /api/v1/feed:
    get:
      operationId: getFeed
      description: |
        Ranked company feed built from content-service news. Items are ordered by
        relevance and then by publication date.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Sector"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Ranked feed
          content:
            application/json:
              schema:
                type: object
                required: [items, total, facets]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeedItem"
                  total:
                    type: integer
                    minimum: 0
                  facets:
                    $ref: "#/components/schemas/FeedFacets"
        "400":
          description: company_id is missing or pagination, filter or sort values are invalid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Company not found or not accessible to the user
        "502":
          description: Company or content service is unavailable
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /api/v1/insights/jobs:
    post:
      operationId: createInsightJob
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInsightJob"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightJob"
        "400":
          description: Malformed request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Company not found or not accessible to the user
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /api/v1/insights/jobs/{jobId}:
    get:
      operationId: getInsightJob
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Job not found or not accessible to the user
  /api/v1/insights/jobs/{jobId}/events:
    get:
      operationId: streamInsightJob
      description: SSE stream. Supports Last-Event-ID for resume.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: SSE stream of status, step, result and error events
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Job not found or not accessible to the user
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: alfa_session
  responses:
    Unauthorized:
      description: Session is missing or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdentityUnavailable:
      description: Identity service is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    CompanyId:
      name: company_id
      in: query
      required: true
      schema:
        type: string
    Source:
      name: source
      in: query
      required: false
      description: Repeatable source filter. Comma-separated values are also accepted.
      schema:
        type: string
    Tag:
      name: tag
      in: query
      required: false
      description: Repeatable tag filter. Comma-separated values are also accepted.
      schema:
        type: string
    Sector:
      name: sector
      in: query
      required: false
      description: Repeatable target-sector filter. Comma-separated values are also accepted.
      schema:
        type: string
    Query:
      name: q
      in: query
      required: false
      description: Case-insensitive search over title, summary, source, tags and sectors.
      schema:
        type: string
        maxLength: 200
    From:
      name: from
      in: query
      required: false
      description: Include news published on or after this date.
      schema:
        type: string
    To:
      name: to
      in: query
      required: false
      description: Include news published on or before this date.
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      description: Sort by relevance (default) or by publication date.
      schema:
        type: string
        enum: [relevance, date]
        default: relevance
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 30
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PathCompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
    PathUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
  schemas:
    CompanyUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        inn:
          type: string
          pattern: "^([0-9]{10}|[0-9]{12})$"
        industry:
          type: string
        region:
          type: string
        city:
          type: string
        description:
          type: string
        revenue:
          type: string
          pattern: "^[0-9]+$"
    CompanyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        inn:
          type: string
          pattern: "^([0-9]{10}|[0-9]{12})$"
        industry:
          type: string
        region:
          type: string
        city:
          type: string
        description:
          type: string
        revenue:
          type: string
          pattern: "^[0-9]+$"
        client_type:
          type: string
        okved_code:
          type: string
        okved_name:
          type: string
    Member:
      type: object
      required: [user_id, email, role]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, member]
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    AddMember:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    MemberRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, member]
    Company:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        inn:
          type: string
        industry:
          type: string
        region:
          type: string
        description:
          type: string
        group_id:
          type: string
        okved_code:
          type: string
        okved_name:
          type: string
        client_type:
          type: string
        revenue:
          type: string
        city:
          type: string
        products:
          type: object
          additionalProperties:
            type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
    Person:
      type: object
      required: [id, full_name, role, created_at]
      properties:
        id:
          type: string
        full_name:
          type: string
        role:
          type: string
        city:
          type: string
        region:
          type: string
        created_at:
          type: string
          format: date-time
    CompanyPerson:
      type: object
      required: [person, relation]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        relation:
          type: string
    CompanyRelation:
      type: object
      required: [company_id, company_name, type, types, relation]
      properties:
        company_id:
          type: string
        company_name:
          type: string
        type:
          type: string
          enum: [group, shared_person, counterparty]
        types:
          type: array
          items:
            type: string
            enum: [group, shared_person, counterparty]
        relation:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        amount:
          type: number
        count:
          type: integer
          format: int64
        inbound:
          $ref: "#/components/schemas/RelationFlow"
        outbound:
          $ref: "#/components/schemas/RelationFlow"
        shared_people:
          type: integer
          format: int64
    CompanyDetails:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          required: [people, relations]
          properties:
            people:
              type: array
              items:
                $ref: "#/components/schemas/CompanyPerson"
            relations:
              type: array
              items:
                $ref: "#/components/schemas/CompanyRelation"
    EventContext:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
    CreateInsightJob:
      type: object
      required: [company_id, event]
      properties:
        company_id:
          type: string
        event:
          $ref: "#/components/schemas/EventContext"
    InsightJob:
      type: object
      required: [job_id, status, events_url]
      properties:
        job_id:
          type: string
        company_id:
          type: string
        status:
          type: string
          enum: [queued, running, done, failed]
        events_url:
          type: string
        insight:
          $ref: "#/components/schemas/Insight"
        error:
          type: string
    FeedItem:
      type: object
      required:
        - event_id
        - company_id
        - title
        - summary
        - published_at
        - relevance
        - reasons
        - tags
        - target_sectors
      properties:
        event_id:
          type: string
        company_id:
          type: string
        title:
          type: string
        summary:
          type: string
        source:
          type: string
        url:
          type: string
        published_at:
          type: string
          format: date-time
        relevance:
          type: number
          minimum: 0
          maximum: 1
        reasons:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        target_sectors:
          type: array
          items:
            type: string
    FeedFacet:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
          minimum: 0
    FeedFacets:
      type: object
      required: [sources, tags, sectors]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/FeedFacet"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/FeedFacet"
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/FeedFacet"
