[project]
name = "alfa-hack-agent"
version = "0.1.0"
description = "Stateless news impact analysis agent"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sse-starlette>=2.2,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["app/contracts/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
