openapi: 3.1.0
info:
  title: Alfa Hack Agent API
  version: 0.1.0
  description: Stateless Python agent. Receives company context and evidence, streams progress and a structured insight.
servers:
  - url: http://agent:8090
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                required: [status, mode]
                properties:
                  status:
                    type: string
                    const: ok
                  mode:
                    type: string
                    enum: [stub, live]
  /v1/analyses:
    post:
      operationId: createAnalysis
      description: Streams step events followed by one result or error event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
      responses:
        "200":
          description: SSE stream with step, result and error events
          content:
            text/event-stream:
              schema:
                type: string
        "422":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/rag/build-index:
    post:
      operationId: buildRagIndex
      description: Starts a background index build from PDF files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagBuildIndexRequest"
      responses:
        "200":
          description: Index build started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagJobAccepted"
  /v1/rag/update-index:
    post:
      operationId: updateRagIndex
      description: Starts a background incremental index update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagUpdateIndexRequest"
      responses:
        "200":
          description: Index update started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagJobAccepted"
  /v1/rag/query:
    post:
      operationId: queryRagIndex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagQueryRequest"
      responses:
        "200":
          description: RAG answer with source labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagQueryResponse"
        "404":
          description: RAG index not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/rag/stats:
    get:
      operationId: getRagStats
      parameters:
        - name: index_dir
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: RAG index statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagStats"
components:
  schemas:
    AnalysisRequest:
      type: object
      required: [request_id, company, event]
      properties:
        request_id:
          type: string
        company:
          $ref: "#/components/schemas/CompanyContext"
        event:
          $ref: "#/components/schemas/EventContext"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        locale:
          type: string
          default: ru
        mode:
          type: string
          enum: [live, demo]
          default: live
    CompanyContext:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        inn:
          type: string
        industry:
          type: string
        region:
          type: string
        description:
          type: string
    EventContext:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        published_at:
          type: string
          format: date-time
    Evidence:
      type: object
      required: [source_id, title, url]
      properties:
        source_id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        snippet:
          type: string
        published_at:
          type: string
          format: date-time
    Source:
      type: object
      required: [source_id, title, url]
      properties:
        source_id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
    Insight:
      type: object
      required:
        - summary
        - why_it_matters
        - risks
        - opportunities
        - bank_position
        - ai_conclusion
        - sources
        - actions
        - confidence
      properties:
        summary:
          type: string
        why_it_matters:
          type: string
        risks:
          type: array
          items:
            type: string
        opportunities:
          type: array
          items:
            type: string
        bank_position:
          type: string
        ai_conclusion:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        actions:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        meta:
          type: object
          additionalProperties: true
    RagBuildIndexRequest:
      type: object
      properties:
        data_dir:
          type: string
        index_dir:
          type: string
    RagUpdateIndexRequest:
      type: object
      properties:
        data_dir:
          type: string
        index_dir:
          type: string
    RagQueryRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        index_dir:
          type: string
        model:
          type: string
          default: gpt-5.6-sol
        top_k:
          type: integer
          default: 5
          minimum: 1
    RagQueryResponse:
      type: object
      required: [answer, sources]
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            type: string
    RagJobAccepted:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
        message:
          type: string
    RagStats:
      type: object
      required: [processed_files, total_pages, files, index_dir, index_exists]
      properties:
        processed_files:
          type: integer
        total_pages:
          type: integer
        files:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        index_dir:
          type: string
        index_exists:
          type: boolean
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
