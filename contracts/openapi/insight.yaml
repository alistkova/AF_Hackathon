openapi: 3.1.0
info:
  title: Insight Service API
  version: 0.1.0
servers:
  - url: http://insight:8083
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: Ready
  /api/v1/feed:
    get:
      operationId: getFeed
      description: |
        Ranked company feed built from news owned by the content service. Items are ordered
        by relevance and then by publication date. Relevance combines company name, industry,
        region and recency signals.
      parameters:
        - name: company_id
          in: query
          required: true
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Repeatable source filter. Comma-separated values are also accepted.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Repeatable tag filter. Comma-separated values are also accepted.
          schema:
            type: string
        - name: sector
          in: query
          required: false
          description: Repeatable target-sector filter. Comma-separated values are also accepted.
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Case-insensitive search over title, summary, source, tags and sectors.
          schema:
            type: string
            maxLength: 200
        - name: from
          in: query
          required: false
          description: Include news published on or after this date.
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: Include news published on or before this date.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort by relevance (default) or by publication date.
          schema:
            type: string
            enum: [relevance, date]
            default: relevance
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 30
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Ranked feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
        "400":
          description: company_id is missing or pagination is invalid
        "404":
          description: Company not found
        "502":
          description: Company or content service is unavailable
  /api/v1/insights/jobs:
    post:
      operationId: createInsightJob
      responses:
        "202":
          description: Job accepted
        "400":
          description: Malformed request
        "404":
          description: Company not found
        "502":
          description: Company or agent service is unavailable
  /api/v1/insights/jobs/{jobId}:
    get:
      operationId: getInsightJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job state
  /api/v1/insights/jobs/{jobId}/events:
    get:
      operationId: streamInsightJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
components:
  schemas:
    FeedItem:
      type: object
      required:
        - event_id
        - company_id
        - title
        - summary
        - published_at
        - relevance
        - reasons
        - tags
        - target_sectors
      properties:
        event_id:
          type: string
        company_id:
          type: string
        title:
          type: string
        summary:
          type: string
        source:
          type: string
        url:
          type: string
        published_at:
          type: string
          format: date-time
        relevance:
          type: number
          minimum: 0
          maximum: 1
        reasons:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        target_sectors:
          type: array
          items:
            type: string
    FeedFacet:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
          minimum: 0
    FeedFacets:
      type: object
      required: [sources, tags, sectors]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/FeedFacet"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/FeedFacet"
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/FeedFacet"
    FeedResponse:
      type: object
      required: [items, total, facets]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        total:
          type: integer
          minimum: 0
        facets:
          $ref: "#/components/schemas/FeedFacets"
